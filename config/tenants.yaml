# One entry per tenant. Adding a tenant = add an entry here + drop its files under
# fixtures/<slug>/<source>/ (and list them in fixtures/manifest.json). No code changes.
#
# api_key_hash is sha256(api_key) in hex. Generate one with:
#   npm run hash-key -- <your-key>
# The demo keys are "lumen-demo-key" and "northwind-demo-key".
#
# column_aliases maps a column name a source started sending to the canonical name the
# pipeline expects. Leave it empty until someone confirms what the new column means:
# an unknown header quarantines the file instead of guessing (see QUESTIONS.md Q2).

tenants:
  - slug: lumen
    name: Lumen
    api_key_hash: f701786c18986d7dddec924561b70c8dc7fea4c03de1f107260b0f4fe2d41fc2
    timezone: UTC
    currency: EUR
    sources:
      orders: { column_aliases: {} }
      refunds: { column_aliases: {} }
      ad_spend: { column_aliases: {} }
      email_events: { column_aliases: {} }

  - slug: northwind
    name: Northwind
    api_key_hash: 9d0a288dafcda4c6ef42cc5428bf79fc3b0df86b9d9923b46244abda5314c74e
    timezone: UTC
    currency: USD
    sources:
      orders: { column_aliases: {} }
      refunds: { column_aliases: {} }
      ad_spend: { column_aliases: {} }
      email_events: { column_aliases: {} }
